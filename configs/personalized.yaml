# Personalized Federated Learning Configuration
experiment:
  name: "personalized_fl_baseline"
  mode: "personalized_finetune" # "personalized_finetune" or "local_only"
  seed: 42
  device: "auto"
  output_dir: "./results"

dataset:
  name: "mnist"
  data_dir: "./data"
  num_clients: 5
  partition_strategy: "dirichlet"
  dirichlet_alpha: 0.5
  test_split_ratio: 0.2

model:
  architecture: "cnn"
  in_channels: 1
  num_classes: 10

federated:
  num_rounds: 5
  client_fraction: 1.0
  local_epochs: 1
  finetune_epochs: 1
  learning_rate: 0.01
  finetune_lr: 0.005
  momentum: 0.9
  weight_decay: 0.0001
  optimizer: "sgd"

logging:
  log_level: "INFO"
